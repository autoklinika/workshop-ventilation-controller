name: HMI Android

on:
  push:
    branches:
      - agent/iiyama-android-kiosk-stage3-service-exit
    paths:
      - 'hmi/iiyama-android/**'
      - '.github/workflows/hmi-android.yml'
  pull_request:
    paths:
      - 'hmi/iiyama-android/**'
      - '.github/workflows/hmi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: hmi/iiyama-android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: test -s hmi/iiyama-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workshop-ventilation-hmi-kiosk-stage3-service-exit
          path: hmi/iiyama-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
