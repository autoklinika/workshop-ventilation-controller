name: Sensor node firmware

on:
  pull_request:
    paths:
      - "firmware/sensor-node/**"
      - ".github/workflows/sensor-node-firmware.yml"
  push:
    branches:
      - main
    paths:
      - "firmware/sensor-node/**"
      - ".github/workflows/sensor-node-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        working-directory: firmware/sensor-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show ESP-IDF version
        run: idf.py --version
      - name: Configure target
        run: idf.py set-target esp32
      - name: Build firmware
        run: idf.py build
      - name: Verify partition table
        run: python "$IDF_PATH/components/partition_table/gen_esp32part.py" build/partition_table/partition-table.bin
