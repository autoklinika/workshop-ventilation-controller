name: Sensor node firmware

on:
  pull_request:
    paths:
      - "firmware/sensor-node/**"
      - "tools/read_modbus_sensor.py"
      - "tools/read_modbus_sensor_nodes.py"
      - "tools/provision_sensor_node_address.py"
      - "tools/provision_sensor_node_service.py"
      - ".github/workflows/sensor-node-firmware.yml"
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "firmware/sensor-node/**"
      - "tools/read_modbus_sensor.py"
      - "tools/read_modbus_sensor_nodes.py"
      - "tools/provision_sensor_node_address.py"
      - "tools/provision_sensor_node_service.py"
      - ".github/workflows/sensor-node-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
        working-directory: firmware/sensor-node
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run host register-map tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I components/modbus/include \
            components/modbus/src/register_map.cpp \
            test/host/test_modbus_register_map.cpp \
            -o /tmp/test_modbus_register_map
          /tmp/test_modbus_register_map
      - name: Check Stage 2B and service provisioning tools
        run: |
          python3 -m py_compile \
            ../../tools/read_modbus_sensor.py \
            ../../tools/read_modbus_sensor_nodes.py \
            ../../tools/provision_sensor_node_address.py \
            ../../tools/provision_sensor_node_service.py
          if python3 ../../tools/provision_sensor_node_address.py --port TEST --address 0; then
            echo "Address 0 was incorrectly accepted"
            exit 1
          fi
          if python3 ../../tools/provision_sensor_node_address.py --port TEST --address 248; then
            echo "Address 248 was incorrectly accepted"
            exit 1
          fi
          if python3 ../../tools/provision_sensor_node_service.py \
              --port TEST --modbus-address 0 --node-id sensor-zone-1 \
              --registry /tmp/keys.json </dev/null; then
            echo "Service provisioning incorrectly accepted Modbus address 0"
            exit 1
          fi
      - name: Configure and build firmware
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32
          idf.py build
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" build/partition_table/partition-table.bin
      - name: Upload OTA bootstrap firmware
        uses: actions/upload-artifact@v4
        with:
          name: kamod-service-ota-bootstrap-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firmware/sensor-node/build/*.bin
            firmware/sensor-node/build/bootloader/*.bin
            firmware/sensor-node/build/partition_table/*.bin
            firmware/sensor-node/build/flasher_args.json
