name: Sensor node firmware

on:
  pull_request:
    paths:
      - "firmware/sensor-node/**"
      - ".github/workflows/sensor-node-firmware.yml"
  push:
    branches:
      - main
    paths:
      - "firmware/sensor-node/**"
      - ".github/workflows/sensor-node-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
        working-directory: firmware/sensor-node
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run host register-map tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I components/modbus/include \
            components/modbus/src/register_map.cpp \
            test/host/test_modbus_register_map.cpp \
            -o /tmp/test_modbus_register_map
          /tmp/test_modbus_register_map
      - name: Configure and build firmware
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32
          idf.py build
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" build/partition_table/partition-table.bin
