schema_version = 1
policy_version = "2026-08-21.1"
policy_name = "Workshop Ventilation Controller - AlertV2 default policy"
description = "Domyślna, deklaratywna macierz wag, reakcji i kolorów HMI dla AlertV2."
runtime_path = "/etc/workshop-ventilation/alerts-v2.toml"

# Ten plik jest projektem docelowej polityki AlertV2.
# Na tym etapie ventilation-core NIE ładuje go jeszcze produkcyjnie.
# Detekcja pozostaje w testowalnym kodzie core/system/HMI, a ten plik ma określać
# wagę, reakcję, zakres i kolor paska HMI. Nowe detektory wymagające nowej logiki
# nadal muszą zostać zaimplementowane i zwalidowane w kodzie.
#
# Dodatkowe nastawy istniejącego detektora należy dodawać wyłącznie jako:
# [alerts.CODE.parameters]
# Sam TOML nie wykonuje logiki i nie jest językiem automatyki.
#
# Twarde niezmienniki bezpieczeństwa NIE są konfigurowalne i mają być wymuszane
# przez kod/validator. W szczególności sam brak TACHO NIGDY nie może zatrzymać
# wentylacji ani wymusić globalnego safe_state.

[behavior]
highest_active_weight_controls_hmi = true
acknowledgement_changes_weight = false
acknowledgement_changes_hmi_color = false
cleared_alerts_affect_hmi = false
unknown_alert_policy = "reject"
invalid_configuration_policy = "reject_keep_last_known_good"

[weight.normal]
value = 0
severity = "normal"
hmi_color = "green"

[weight.info]
value = 1
severity = "info"
hmi_color = "blue"

[weight.warning]
value = 2
severity = "warning"
hmi_color = "yellow"

[weight.alarm]
value = 3
severity = "alarm"
hmi_color = "orange"

[weight.critical]
value = 4
severity = "critical"
hmi_color = "red"

