# Workshop Ventilation Controller — prywatny DHCP dla węzłów KAmod/SEN55.
# DNS jest wyłączony. Klienci nie otrzymują bramy domyślnej.

port=0
interface=wlan0
bind-dynamic
dhcp-authoritative

dhcp-range=10.55.0.100,10.55.0.119,255.255.255.0,12h

# Puste opcje zapobiegają wysyłaniu default gateway i DNS.
dhcp-option=option:router
dhcp-option=option:dns-server

dhcp-leasefile=/var/lib/misc/dnsmasq-wvc.leases
log-dhcp
