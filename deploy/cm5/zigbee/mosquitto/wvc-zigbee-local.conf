# Workshop Ventilation Controller - local MQTT broker for Zigbee
# Intentionally bound to loopback only. ventilation-core and Zigbee2MQTT
# communicate locally on the CM5; no LAN listener is required.
listener 1883 127.0.0.1
allow_anonymous true

# MQTT is only a local transport bus. Historical/persistent state belongs on the
# NVMe application data tier (Zigbee2MQTT database and WVC telemetry), not in a
# second Mosquitto persistence database on eMMC.
persistence false
