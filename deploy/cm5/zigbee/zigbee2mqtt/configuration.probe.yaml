version: 5

homeassistant:
  enabled: false

# WVC owns the operator UI. Zigbee2MQTT stays an internal backend service.
frontend:
  enabled: false

mqtt:
  base_topic: zigbee2mqtt
  server: "mqtt://127.0.0.1:1883"

# Keep the stable udev by-id path. Adapter type is intentionally omitted for
# the first controlled start so Zigbee2MQTT/zigbee-herdsman can attempt its
# native adapter discovery. If discovery fails, Stage 3 stops and reports logs
# instead of guessing the radio driver.
serial:
  port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_822f54682ed0f01198f6423758f97c40-if00-port0"

availability:
  enabled: true

advanced:
  log_level: debug
  log_output:
    - console
  last_seen: ISO_8601
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
