# Keep the existing service and its safety dependencies. Only replace its
# ExecStart with the autostart gate; its shutdown path imports the existing
# root-owned RTC/power script and calls unchanged wvc-host-power functions.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/wvc-autostart-gate.py tick
Environment=PYTHONDONTWRITEBYTECODE=1
