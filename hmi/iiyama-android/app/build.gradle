plugins {
    id 'com.android.application'
}

def serviceAccess = new Properties()
def serviceAccessFile = rootProject.file('service-access.properties')
if (serviceAccessFile.exists()) {
    serviceAccessFile.withInputStream { serviceAccess.load(it) }
}

def servicePinSha256 = serviceAccess.getProperty('servicePinSha256', '').trim()
def serviceNfcUids = serviceAccess.getProperty('serviceNfcUids', '').trim()
def adminSettingsPinSha256 = serviceAccess.getProperty('adminSettingsPinSha256', '').trim()

android {
    namespace = 'pl.autoklinika.workshopventilation.hmi'

    compileSdk {
        version = release(37) {
            it.minorApiLevel = 0
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = 'pl.autoklinika.workshopventilation.hmi'
        minSdk = 33
        targetSdk = 33
        versionCode = 13
        versionName = '0.5.6-led-red-500ms'

        // Stage 3 values are retained only as a one-way migration fallback.
        // Stage 4 normal service credentials are managed locally on the HMI.
        // The administrator PIN for the service-settings tile is fixed per APK build
        // and deliberately has no in-app change path.
        buildConfigField 'String', 'SERVICE_PIN_SHA256', '"' + servicePinSha256 + '"'
        buildConfigField 'String', 'SERVICE_NFC_UIDS', '"' + serviceNfcUids + '"'
        buildConfigField 'String', 'ADMIN_SETTINGS_PIN_SHA256', '"' + adminSettingsPinSha256 + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
