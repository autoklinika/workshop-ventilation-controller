[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-ventilation-core"
version = "0.1.0"
description = "Layered control core for the workshop ventilation system"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
ventilation-core = "ventilation_core.main:main"
ventilationctl = "ventilation_core.ctl:main"
wvc-service-heartbeat = "ventilation_core.service_heartbeat:main"
ventilation-telemetry-sync = "ventilation_core.telemetry.main:main"
ventilation-ai-advisory = "ventilation_core.advisory.main:main"
ventilation-weather = "ventilation_core.weather.main:main"
ventilation-web-ui = "ventilation_core.web.main:main"
wvc-alertctl = "ventilation_core.alertctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ventilation_core.web" = ["static/*.html", "static/*.css", "static/*.js"]
